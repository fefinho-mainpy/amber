name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Amber-SwiftUI.zip

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build
        working-directory: Amber
        run: bash build_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Amber-ipa
          path: Amber/build/Amber.ipa
